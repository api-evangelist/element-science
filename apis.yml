name: Element Science
description: 'Element Science is a San Francisco-based medical device and digital health company
  focused on high-risk cardiovascular patients. Its flagship product is the Jewel Patch-Wearable
  Cardioverter Defibrillator (P-WCD) — a low-profile, water-resistant wearable that continuously
  monitors for and treats life-threatening ventricular arrhythmias in patients at temporary elevated
  risk of sudden cardiac arrest. The Jewel received FDA Premarket Approval in 2025 and CE Mark / UKCA
  marking in January 2024. Element Science is a portfolio company of GV. Added to the API Evangelist
  network as a lead; no public developer API or machine-readable specification has been identified for
  this provider at the time of enrichment.'
